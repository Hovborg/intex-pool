[project]
name = "intex-pool-ha"
version = "0.9.4"
description = "Home Assistant integration for Intex / AGP (Tuya-based) pool equipment"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
